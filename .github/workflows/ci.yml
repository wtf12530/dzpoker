name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: 1
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies (main)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run smoke tests (start server & health check)
        run: |
          python tests/smoke_test.py

  training_and_export:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 90
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install training dependencies (with PyTorch CPU)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision --upgrade
          pip install -r requirements.txt
          pip install -r training/requirements.txt
          pip install --upgrade "onnxruntime>=1.15"

      - name: Check installs (debug)
        run: |
          python - <<'PY'
          import sys
          try:
              import torch; print('torch:', torch.__version__)
          except Exception as e:
              print('torch import failed:', e)
          try:
              import onnxruntime as ort; print('onnxruntime:', ort.__version__)
          except Exception as e:
              print('onnxruntime import failed:', e)
          try:
              import onnx; print('onnx:', onnx.__version__)
          except Exception as e:
              print('onnx import failed:', e)
          PY

      - name: Run training (capture console & fail on error)
        # 注意：这里不再吞掉非零退出码；训练 stdout/stderr 同时写入文件并打印在日志中
        run: |
          mkdir -p training
          # run with unbuffered output (-u) to flush prints; tee both stdout+stderr
          python -u -m training.train_supervised --data training/data/selfplay.npz --out training/models/policy.pt --input-dim 29 --n-actions 6 --epochs 100 2>&1 | tee training/train_console.txt

      - name: List training directory & model files (debug)
        run: |
          echo "PWD: $(pwd)"
          echo "---- training/ ----"
          ls -la training || true
          echo "---- training/models/ ----"
          ls -la training/models || true
          echo "---- training/train_console.txt (tail) ----"
          tail -n 200 training/train_console.txt || true

      - name: Export to ONNX if model present (tolerant)
        run: |
          if [ -f training/models/policy.pt ]; then
            python -m training.export_onnx --model training/models/policy.pt --out training/models/policy.onnx --input-dim 29 --n-actions 6 || echo "ONNX export failed; continuing pipeline"
          else
            echo "No model found at training/models/policy.pt, skipping export"
          fi

      - name: Evaluate model (Torch & ONNX) and save output (tolerant)
        run: |
          python -m training.evaluate_model --model training/models/policy.pt --onnx training/models/policy.onnx --input-dim 29 --n-actions 6 | tee training/eval_output.txt || echo "Evaluate script exited non-zero; see training/eval_output.txt"

      - name: Ensure artifacts exist (placeholders to avoid empty uploads)
        run: |
          mkdir -p training/models
          if [ ! -f training/train_log.csv ]; then
            echo "epoch,epochs,avg_loss,train_acc,val_acc" > training/train_log.csv
          fi
          if [ ! -f training/models/policy.pt ] && [ ! -f training/models/best_policy.pt ]; then
            echo "placeholder" > training/models/placeholder.txt
          fi

      - name: Upload training/models (all files)
        uses: actions/upload-artifact@v4
        with:
          name: training-models
          path: training/models

      - name: Upload training console
        uses: actions/upload-artifact@v4
        with:
          name: training-console
          path: training/train_console.txt

      - name: Upload training log
        uses: actions/upload-artifact@v4
        with:
          name: training-log
          path: training/train_log.csv

      - name: Upload evaluation output
        uses: actions/upload-artifact@v4
        with:
          name: eval-output
          path: training/eval_output.txt

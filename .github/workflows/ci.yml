name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: 1
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies (main)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run smoke tests (start server & health check)
        run: |
          python tests/smoke_test.py

  training_and_export:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install training dependencies (with PyTorch CPU)
        run: |
          python -m pip install --upgrade pip
          # Install PyTorch CPU wheels (use the PyTorch CPU index for reliable CPU wheel install)
          # If this fails, the job will stop here which helps surface install problems.
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision --upgrade
          pip install -r requirements.txt
          pip install -r training/requirements.txt
          pip install --upgrade "onnxruntime>=1.15"

      - name: Check installs (debug)
        run: |
          python - <<'PY'
          import sys
          try:
              import torch
              print('torch:', torch.__version__)
          except Exception as e:
              print('torch missing or failed to import:', e)
          try:
              import onnxruntime as ort
              print('onnxruntime:', ort.__version__)
          except Exception as e:
              print('onnxruntime missing or failed to import:', e)
          try:
              import onnx
              print('onnx:', onnx.__version__)
          except Exception as e:
              print('onnx missing or failed to import:', e)
          PY

      - name: Train (if dataset present) or create model (continue on failure for debug)
        run: |
          # Run training; if it fails we continue so debug artifacts can be uploaded.
          python -m training.train_supervised --data training/data/selfplay.npz --out training/models/policy.pt --input-dim 29 --n-actions 6 --epochs 100 || (echo "Train failed (non-zero exit); continuing for debug" && true)

      - name: Export to ONNX if model present (tolerant)
        run: |
          if [ -f training/models/policy.pt ]; then
            python -m training.export_onnx --model training/models/policy.pt --out training/models/policy.onnx --input-dim 29 --n-actions 6 || echo "ONNX export failed; continuing pipeline"
          else
            echo "No model found at training/models/policy.pt, skipping export"
          fi

      - name: Evaluate model (Torch & ONNX) and save output (tolerant)
        run: |
          # Evaluate script should handle missing ONNX gracefully; tee output to file for artifact upload.
          python -m training.evaluate_model --model training/models/policy.pt --onnx training/models/policy.onnx --input-dim 29 --n-actions 6 | tee training/eval_output.txt || echo "Evaluate script exited non-zero; see evaluation output"

      - name: List training directory & model files (debug)
        run: |
          echo "---- training/ ----"
          ls -la training || true
          echo "---- training/models/ ----"
          ls -la training/models || true

      - name: Ensure training log exists (placeholder if missing)
        run: |
          mkdir -p training
          if [ ! -f training/train_log.csv ]; then
            echo "epoch,epochs,avg_loss,train_acc,val_acc" > training/train_log.csv
            echo "Created placeholder training/train_log.csv"
          else
            echo "training/train_log.csv exists"
          fi

      - name: Upload training/models for debug (if present)
        uses: actions/upload-artifact@v4
        with:
          name: training-models
          path: training/models

      - name: Upload ONNX artifact (if present)
        uses: actions/upload-artifact@v4
        with:
          name: policy-onnx
          path: training/models/policy.onnx

      - name: Upload evaluation output
        uses: actions/upload-artifact@v4
        with:
          name: eval-output
          path: training/eval_output.txt

      - name: Upload training log
        uses: actions/upload-artifact@v4
        with:
          name: training-log
          path: training/train_log.csv

      - name: Upload best model (if present)
        uses: actions/upload-artifact@v4
        with:
          name: best-model
          path: training/models/best_policy.pt

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: 1
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies (main)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run smoke tests (start server & health check)
        run: |
          python tests/smoke_test.py
      - name: Upload training log
        uses: actions/upload-artifact@v4
        with:
          name: training-log
          path: training/train_log.csv
      
  training_and_export:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r training/requirements.txt
          pip install --upgrade "onnxruntime>=1.15"
      - name: Train (if dataset present) or create model
        run: |
          python -m training.train_supervised --data training/data/selfplay.npz --out training/models/policy.pt --input-dim 29 --n-actions 6 --epochs 100
      - name: Export to ONNX if model present
        run: |
          if [ -f training/models/policy.pt ]; then
            # Try to export; don't fail the whole job if export fails.
            python -m training.export_onnx --model training/models/policy.pt --out training/models/policy.onnx --input-dim 29 --n-actions 6 || echo "ONNX export failed; continuing pipeline"
          else
            echo "No model found at training/models/policy.pt, skipping export"
          fi
      - name: Evaluate model (Torch & ONNX) and save output
        run: |
          python -m training.evaluate_model --model training/models/policy.pt --onnx training/models/policy.onnx --input-dim 29 --n-actions 6 | tee training/eval_output.txt
      - name: Upload ONNX artifact (if present)
        uses: actions/upload-artifact@v4
        with:
          name: policy-onnx
          path: training/models/policy.onnx
      - name: Upload evaluation output
        uses: actions/upload-artifact@v4
        with:
          name: eval-output
          path: training/eval_output.txt
